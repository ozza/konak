# From the Jellyfin docs compose example (docs/general/installation/_container-docker-compose.md).
# Template fill only: placeholder paths set, optional lines (user, media2, fonts, PublishedServerUrl) dropped.
services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ./config:/config
      - ./cache:/cache
      - type: bind
        source: ./media
        target: /media
    restart: 'unless-stopped'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
