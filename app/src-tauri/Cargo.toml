[package]
name = "konak"
version = "0.1.0"
description = "Konak: turn a Windows PC into a home server"
authors = ["Konak contributors"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "konak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.14"
# Checks a root CA brought back by a restore (already in the tree through rcgen).
x509-parser = { version = "0.18", features = ["verify"] }
time = "0.3"
sha2 = "0.10"
base64 = "0.23"
regex = "1"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-std"] }
# Bind-only port test for the web port choice (already in the tree through tokio).
socket2 = "0.6"
# Job object for the child processes, the MCP pipe, and the taskbar flash for an MCP request
# (already in the tree through Tauri's dependencies).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }
# Ids for MCP confirmation requests, from the OS generator (already in the tree through Tauri).
getrandom = "0.3"
# Windows notification for an MCP request waiting for the user's answer; shown from Rust only.
tauri-plugin-notification = "2"
# Folder and file pickers for the Settings page (backup location, restore file).
tauri-plugin-dialog = "2"
# Backup files: a tar stream, zstd-compressed, encrypted with the backup password (age, scrypt).
tar = "0.4"
zstd = "0.13"
age = "0.11"

# Debug builds (the dev app and the tests) with optimized crypto and compression: unoptimized
# scrypt takes ~17 s per opened backup file, and decryption and zstd crawl.
[profile.dev.package]
scrypt = { opt-level = 3 }
salsa20 = { opt-level = 3 }
pbkdf2 = { opt-level = 3 }
hmac = { opt-level = 3 }
sha2 = { opt-level = 3 }
chacha20 = { opt-level = 3 }
chacha20poly1305 = { opt-level = 3 }
poly1305 = { opt-level = 3 }
age = { opt-level = 3 }
age-core = { opt-level = 3 }
zstd-sys = { opt-level = 3 }

[dev-dependencies]
# `datetime!` in the schedule tests.
time = { version = "0.3", features = ["macros"] }
