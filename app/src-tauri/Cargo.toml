[package]
name = "konak"
version = "0.1.0"
description = "Konak: turn a Windows PC into a home server"
authors = ["Konak contributors"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "konak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.14"
time = "0.3"
sha2 = "0.10"
base64 = "0.23"
regex = "1"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-std"] }
# Bind-only port test for the web port choice (already in the tree through tokio).
socket2 = "0.6"
# Job object for the child processes (already in the tree through Tauri's dependencies).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
